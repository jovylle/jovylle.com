<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Menu Widget</title>
    <style>
        /* Widget Styles */
        .mystery-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Dynamic positioning classes */
        .mystery-widget.bottom-right { bottom: 20px; right: 20px; }
        .mystery-widget.bottom-left { bottom: 20px; left: 20px; }
        .mystery-widget.top-right { top: 20px; right: 20px; }
        .mystery-widget.top-left { top: 20px; left: 20px; }

        /* Size variants */
        .mystery-widget.size-small .mystery-widget-container { width: 280px; max-height: 350px; }
        .mystery-widget.size-medium .mystery-widget-container { width: 320px; max-height: 400px; }
        .mystery-widget.size-large .mystery-widget-container { width: 360px; max-height: 500px; }

        .mystery-widget-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 2px solid #dee2e6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #6c757d;
            transition: all 0.3s ease;
            user-select: none;
        }

        .mystery-widget-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
        }

        .mystery-widget-container {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 320px;
            background: var(--widget-bg, #ffffff);
            border-radius: 8px;
            border: 1px solid var(--widget-border, #e9ecef);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        /* Container positioning based on widget position */
        .mystery-widget.bottom-right .mystery-widget-container,
        .mystery-widget.top-right .mystery-widget-container {
            right: 0;
            left: auto;
        }
        .mystery-widget.bottom-left .mystery-widget-container,
        .mystery-widget.top-left .mystery-widget-container {
            left: 0;
            right: auto;
        }
        .mystery-widget.bottom-right .mystery-widget-container,
        .mystery-widget.bottom-left .mystery-widget-container {
            bottom: 80px;
            top: auto;
        }
        .mystery-widget.top-right .mystery-widget-container,
        .mystery-widget.top-left .mystery-widget-container {
            top: 80px;
            bottom: auto;
        }

        .mystery-widget-container.open {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .mystery-widget-header {
            background: #f8f9fa;
            padding: 4px 8px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .mystery-widget-title {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #495057;
        }

        .mystery-widget-close {
            background: none;
            border: none;
            font-size: 16px;
            color: #6c757d;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .mystery-widget-close:hover {
            background: var(--hover-bg, #e9ecef);
            color: var(--text-primary, #495057);
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 16px;
            color: var(--text-secondary, #6c757d);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
            margin-right: 4px;
        }

        .theme-toggle:hover {
            background: var(--hover-bg, #e9ecef);
            color: var(--text-primary, #495057);
        }

        .mystery-widget-tabs {
            display: flex;
            gap: 8px;
        }

        .mystery-widget-tab {
            padding: 6px 12px;
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: #6c757d;
            transition: all 0.2s ease;
        }

        .mystery-widget-tab.active {
            color: #495057;
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .mystery-widget-tab:hover {
            color: #495057;
            background: #f8f9fa;
        }

        .mystery-widget-content {
            padding: 4px 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .mystery-widget-section {
            margin-bottom: 4px;
        }

        .mystery-widget-section:last-child {
            margin-bottom: 0;
        }

        .mystery-widget-section h4 {
            margin: 0 0 12px 0;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .play-button {
            padding: 4px 8px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .play-button:hover {
            background: #5a6268;
            transform: scale(1.05);
        }

        .mystery-widget-link {
            display: block;
            padding: 4px 8px;
            margin-bottom: 4px;
            text-decoration: none;
            color: #495057;
            font-size: 16px;
            transition: all 0.2s ease;
            border-bottom: 1px solid #e9ecef;
        }

        .mystery-widget-link:hover {
            background: #f8f9fa;
            transform: translateX(2px);
        }

        .mystery-widget-link.portfolio {
            font-weight: 500;
        }

        .mystery-widget-link.portfolio:hover {
            background: #f8f9fa;
        }

        /* Leaderboard Styles */
        .leaderboard {
            padding: 4px 8px;
        }

        .leaderboard h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 600;
            color: #495057;
            text-align: center;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .leaderboard-rank {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            margin-right: 4px;
        }

        .leaderboard-rank.gold {
            background: #f8d7da;
            color: #721c24;
        }

        .leaderboard-rank.silver {
            background: #d1ecf1;
            color: #0c5460;
        }

        .leaderboard-rank.bronze {
            background: #fff3cd;
            color: #856404;
        }

        .leaderboard-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .leaderboard-name {
            font-size: 16px;
            font-weight: 500;
            color: #495057;
            margin: 0;
        }

        .leaderboard-time {
            font-size: 16px;
            color: #6c757d;
            margin: 0;
            padding: 0px;
        }

        .leaderboard-loading {
            text-align: center;
            color: #6c757d;
            font-size: 16px;
            padding: 4px;
        }

        .leaderboard-error {
            text-align: center;
            color: #dc3545;
            font-size: 16px;
            padding: 4px;
        }

        /* Chat Styles */
        .chat-container {
            height: 300px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #e9ecef;
        }

        .chat-message {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .chat-message.user {
            background: #e3f2fd;
            color: #1565c0;
            margin-left: auto;
            text-align: right;
        }

        .chat-message.assistant {
            background: #ffffff;
            color: #495057;
            border: 1px solid #e9ecef;
        }

        .chat-input-container {
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .chat-input:focus {
            border-color: #6c757d;
        }

        .chat-send {
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .chat-send:hover {
            background: #5a6268;
        }

        .chat-send:disabled {
            background: #adb5bd;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding: 8px 12px;
            color: #6c757d;
            font-style: italic;
            font-size: 13px;
        }

        .typing-indicator.show {
            display: block;
        }

        /* Dark theme variables */
        .mystery-widget.dark-theme {
            --widget-bg: #1a1a1a;
            --widget-border: #333333;
            --button-bg: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            --button-border: #404040;
            --button-color: #cccccc;
            --header-bg: #2d2d2d;
            --header-border: #404040;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --hover-bg: #404040;
            --tab-bg: #2d2d2d;
            --tab-border: #404040;
            --tab-active-bg: #404040;
            --tab-active-border: #555555;
            --tab-hover-bg: #333333;
            --content-bg: transparent;
            --link-bg: #2d2d2d;
            --link-border: #404040;
            --link-hover-bg: #404040;
            --link-hover-border: #555555;
            --portfolio-bg: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            --portfolio-border: #404040;
            --portfolio-hover-bg: linear-gradient(135deg, #404040 0%, #2d2d2d 100%);
            --leaderboard-bg: #2d2d2d;
            --leaderboard-border: #404040;
            --leaderboard-item-border: #404040;
            --error-color: #ff6b6b;
            --chat-bg: #2d2d2d;
            --chat-border: #404040;
            --chat-user-bg: #1e3a8a;
            --chat-user-color: #93c5fd;
            --chat-assistant-bg: #1a1a1a;
            --chat-assistant-border: #404040;
            --input-bg: #2d2d2d;
            --input-border: #404040;
            --input-focus-border: #cccccc;
            --button-primary-bg: #6c757d;
            --button-primary-color: #ffffff;
            --button-primary-hover-bg: #5a6268;
            --button-disabled-bg: #555555;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .mystery-widget-container {
                width: 280px;
                right: -20px;
            }
        }
    </style>
</head>
<body>
    <div class="mystery-widget">
        <div class="mystery-widget-button" onclick="toggleWidget()">
            ⚡
        </div>
        <div class="mystery-widget-container" id="widgetContainer">
            <div class="mystery-widget-header">
                <h3 class="mystery-widget-title">Quick Menu</h3>
                <div class="mystery-widget-tabs">
                    <button class="mystery-widget-tab active" onclick="switchTab('links')">Links</button>
                    <button class="mystery-widget-tab" onclick="switchTab('chat')">AI Chat</button>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="#6c757d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="mystery-widget-close" onclick="toggleWidget()">×</button>
            </div>
            
            <div class="mystery-widget-content">
                <!-- Links Tab Content -->
                <div id="linksTab" class="mystery-widget-tab-content">
                    <div class="mystery-widget-section">
                        <h4>🎮 Reaction Test
                            <button class="play-button" onclick="window.open('https://fast.jovylle.com', '_blank')">Play</button>
                        </h4>
                        <div class="leaderboard" id="leaderboard">
                            <h4>🏆 Top Players</h4>
                            <div class="leaderboard-loading">Loading leaderboard...</div>
                        </div>
                    </div>
                    
                    <div class="mystery-widget-section">
                        <h4>🔗 Quick Links</h4>
                        <a href="https://jovylle.com" class="mystery-widget-link portfolio" target="_blank">
                            👨‍💻 Portfolio
                        </a>
                    </div>
                </div>
                
                <!-- AI Chat Tab Content -->
                <div id="chatTab" class="mystery-widget-tab-content" style="display: none;">
                    <div class="chat-container">
                        <div class="chat-messages" id="chatMessages">
                            <div class="chat-message assistant">
                                👋 Hi! I'm here to help you learn about this developer's portfolio. Ask me about their skills, projects, or anything else!
                            </div>
                        </div>
                        <div class="typing-indicator" id="typingIndicator">
                            AI is typing...
                        </div>
                        <div class="chat-input-container">
                            <input type="text" class="chat-input" id="chatInput" placeholder="Ask about skills, projects, etc..." onkeypress="handleChatKeyPress(event)">
                            <button class="chat-send" onclick="sendChatMessage()">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class JovylleWidget {
            constructor() {
                this.isOpen = false;
                this.currentTab = 'links';
                this.skills = ['JavaScript', 'Vue.js', 'Nuxt.js', 'Node.js', 'Python', 'React', 'TypeScript', 'Tailwind CSS', 'Git', 'Docker'];
                this.projects = [
                    { name: 'Personal Portfolio', description: 'Full-stack portfolio website' },
                    { name: 'Reaction Test Game', description: 'Fast-paced reaction testing game' },
                    { name: 'Utility Tools Hub', description: 'Collection of developer tools' },
                    { name: 'Weather App', description: 'Real-time weather application' },
                    { name: 'Wedding Website', description: 'Custom wedding website' }
                ];
                this.analytics = {
                    widgetOpens: 0,
                    widgetCloses: 0,
                    tabSwitches: 0,
                    playButtonClicks: 0,
                    leaderboardRefreshes: 0
                };
                this.init();
            }

            init() {
                this.parseUrlParameters();
                this.loadTheme();
                this.applyConfiguration();
                this.loadLeaderboard();
                this.setupEventListeners();
                this.logAnalytics('widgetLoad');
            }

            parseUrlParameters() {
                const urlParams = new URLSearchParams(window.location.search);
                const position = urlParams.get('position') || 'bottom-right';
                const size = urlParams.get('size') || 'medium';
                const hideChat = urlParams.get('hideChat') === 'true';
                const hidePortfolio = urlParams.get('hidePortfolio') === 'true';
                const showOnly = urlParams.get('showOnly');
                
                // Apply position and size
                const widget = document.querySelector('.mystery-widget');
                widget.className = `mystery-widget ${position} size-${size}`;
                
                // Store configuration
                this.config = {
                    hideChat,
                    hidePortfolio,
                    showOnly: showOnly ? showOnly.split(',') : null
                };
                
                console.log(`Widget configured: position=${position}, size=${size}, hideChat=${hideChat}, hidePortfolio=${hidePortfolio}, showOnly=${showOnly}`);
            }

            loadTheme() {
                const savedTheme = localStorage.getItem('jovylle-widget-theme') || 'light';
                this.setTheme(savedTheme);
            }

            setTheme(theme) {
                const widget = document.querySelector('.mystery-widget');
                const themeButton = document.querySelector('.theme-toggle');
                
                if (theme === 'dark') {
                    widget.classList.add('dark-theme');
                    themeButton.innerHTML = getSunIcon();
                    themeButton.title = 'Switch to light theme';
                } else {
                    widget.classList.remove('dark-theme');
                    themeButton.innerHTML = getMoonIcon();
                    themeButton.title = 'Switch to dark theme';
                }
                
                localStorage.setItem('jovylle-widget-theme', theme);
            }

            toggleTheme() {
                const currentTheme = localStorage.getItem('jovylle-widget-theme') || 'light';
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                this.setTheme(newTheme);
                this.logAnalytics('themeToggle', { theme: newTheme });
            }

            applyConfiguration() {
                // Hide AI Chat tab if configured
                if (this.config.hideChat) {
                    const chatTab = document.querySelector('[onclick="switchTab(\'chat\')"]');
                    if (chatTab) {
                        chatTab.style.display = 'none';
                    }
                    
                    // Hide chat content
                    const chatContent = document.getElementById('chatTab');
                    if (chatContent) {
                        chatContent.style.display = 'none';
                    }
                    
                    // If chat was active, switch to links
                    if (this.currentTab === 'chat') {
                        this.switchTab('links');
                    }
                }
                
                // Hide portfolio link if configured
                if (this.config.hidePortfolio) {
                    const portfolioLink = document.querySelector('.mystery-widget-link.portfolio');
                    if (portfolioLink) {
                        portfolioLink.style.display = 'none';
                    }
                }
                
                // Apply showOnly filter
                if (this.config.showOnly) {
                    const allowedSections = this.config.showOnly;
                    
                    // Hide sections not in showOnly list
                    const sections = {
                        'leaderboard': document.querySelector('.mystery-widget-section:has(.leaderboard)'),
                        'links': document.querySelector('.mystery-widget-section:has(.mystery-widget-link)'),
                        'chat': document.getElementById('chatTab')
                    };
                    
                    Object.keys(sections).forEach(sectionName => {
                        if (!allowedSections.includes(sectionName) && sections[sectionName]) {
                            sections[sectionName].style.display = 'none';
                        }
                    });
                    
                    // Hide chat tab if not in showOnly
                    if (!allowedSections.includes('chat')) {
                        const chatTab = document.querySelector('[onclick="switchTab(\'chat\')"]');
                        if (chatTab) {
                            chatTab.style.display = 'none';
                        }
                    }
                }
            }

            setupEventListeners() {
                // Close widget when clicking outside
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.mystery-widget') && this.isOpen) {
                        this.close();
                    }
                });
            }

            toggle() {
                if (this.isOpen) {
                    this.close();
                } else {
                    this.open();
                }
            }

            open() {
                this.isOpen = true;
                document.getElementById('widgetContainer').classList.add('open');
                this.analytics.widgetOpens++;
                this.logAnalytics('widgetOpen');
            }

            close() {
                this.isOpen = false;
                document.getElementById('widgetContainer').classList.remove('open');
                this.analytics.widgetCloses++;
                this.logAnalytics('widgetClose');
            }

            switchTab(tabName) {
                this.currentTab = tabName;
                
                // Update tab buttons
                document.querySelectorAll('.mystery-widget-tab').forEach(tab => {
                    tab.classList.remove('active');
                });
                document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
                
                // Update tab content
                document.querySelectorAll('.mystery-widget-tab-content').forEach(content => {
                    content.style.display = 'none';
                });
                document.getElementById(`${tabName}Tab`).style.display = 'block';
                
                this.analytics.tabSwitches++;
                this.logAnalytics('tabSwitch', { tab: tabName });
            }

            async loadLeaderboard() {
                const leaderboardElement = document.getElementById('leaderboard');
                this.analytics.leaderboardRefreshes++;
                this.logAnalytics('leaderboardRefresh');
                
                try {
                    // Try to fetch from the Nuxt API first (for local development)
                    const response = await fetch('/api/leaderboard');
                    if (!response.ok) {
                        throw new Error('API not available');
                    }
                    const data = await response.json();
                    this.renderLeaderboard(data);
                } catch (error) {
                    console.log('Local API not available, trying direct fetch...');
                    try {
                        // Fallback to direct fetch (might fail due to CORS)
                        const response = await fetch('https://fast.jovylle.com/reaction/top.json');
                        const data = await response.json();
                        this.renderLeaderboard(data);
                    } catch (corsError) {
                        console.error('CORS error:', corsError);
                        leaderboardElement.innerHTML = `
                            <h4>🏆 Top Players</h4>
                            <div class="leaderboard-error">
                                Leaderboard unavailable<br>
                                <small>Try the game at <a href="https://fast.jovylle.com" target="_blank">fast.jovylle.com</a></small>
                            </div>
                        `;
                    }
                }
            }

            renderLeaderboard(data) {
                const leaderboardElement = document.getElementById('leaderboard');
                
                if (!data.top || data.top.length === 0) {
                    leaderboardElement.innerHTML = `
                        <h4>🏆 Top Players</h4>
                        <div class="leaderboard-error">No scores available</div>
                    `;
                    return;
                }

                const topPlayers = data.top.slice(0, 3);
                const rankColors = ['gold', 'silver', 'bronze'];
                const rankSymbols = ['🥇', '🥈', '🥉'];

                const leaderboardHTML = `
                    <h4>🏆 Top Players</h4>
                    ${topPlayers.map((player, index) => `
                        <div class="leaderboard-item">
                            <div class="leaderboard-rank ${rankColors[index]}">
                                ${rankSymbols[index]}
                            </div>
                            <div class="leaderboard-info">
                                <p class="leaderboard-name">${player.playerName}</p>
                                <p class="leaderboard-time">${player.ms}ms</p>
                            </div>
                        </div>
                    `).join('')}
                `;

                leaderboardElement.innerHTML = leaderboardHTML;
            }

            async sendChatMessage() {
                const input = document.getElementById('chatInput');
                const messagesContainer = document.getElementById('chatMessages');
                const typingIndicator = document.getElementById('typingIndicator');
                const sendButton = document.querySelector('.chat-send');
                
                const message = input.value.trim();
                if (!message) return;

                // Add user message
                this.addChatMessage(message, 'user');
                input.value = '';
                sendButton.disabled = true;

                // Show typing indicator
                typingIndicator.classList.add('show');

                try {
                    // Try Netlify function first (for production), fallback to local API
                    let apiUrl = '/.netlify/functions/chatbot';
                    
                    // Check if we're in local development
                    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        apiUrl = '/api/chatbot';
                    }
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: message,
                            skills: this.skills,
                            projects: this.projects
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    const aiMessage = data.choices?.[0]?.message?.content || 'Sorry, I could not process your request.';

                    // Hide typing indicator
                    typingIndicator.classList.remove('show');

                    // Add AI response
                    this.addChatMessage(aiMessage, 'assistant');

                } catch (error) {
                    console.error('Chat error:', error);
                    
                    // Hide typing indicator
                    typingIndicator.classList.remove('show');
                    
                    // Add error message
                    this.addChatMessage('Sorry, I\'m having trouble connecting right now. Please try again later.', 'assistant');
                } finally {
                    sendButton.disabled = false;
                }
            }

            addChatMessage(message, sender) {
                const messagesContainer = document.getElementById('chatMessages');
                const messageElement = document.createElement('div');
                messageElement.className = `chat-message ${sender}`;
                messageElement.textContent = message;
                messagesContainer.appendChild(messageElement);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            logAnalytics(event, data = {}) {
                const analyticsData = {
                    event,
                    timestamp: new Date().toISOString(),
                    ...data,
                    analytics: this.analytics
                };
                console.log('Widget Analytics:', analyticsData);
                
                // In the future, this could send data to an analytics service
                // fetch('/api/analytics', { method: 'POST', body: JSON.stringify(analyticsData) });
            }
        }

        // Global functions for onclick handlers
        function toggleWidget() {
            window.jovylleWidget.toggle();
        }

        function switchTab(tabName) {
            window.jovylleWidget.switchTab(tabName);
        }

        function sendChatMessage() {
            window.jovylleWidget.sendChatMessage();
        }

        function handleChatKeyPress(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        }

        function toggleTheme() {
            window.jovylleWidget.toggleTheme();
        }

        // Initialize widget when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            window.jovylleWidget = new JovylleWidget();
        });
        
        // Minimal inline icons
        function getMoonIcon() {
            return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="#6c757d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        }
        function getSunIcon() {
            return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="12" r="5" stroke="#6c757d" stroke-width="2"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#6c757d" stroke-width="2" stroke-linecap="round"/></svg>';
        }
    </script>
</body>
