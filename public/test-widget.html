<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Jovylle Widget</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        .content {

        }
        h1 {
            color: #333;
            text-align: center;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
    </style>

<body>
    <div class="content">
        <h1>🧪 Testing Jovylle Widget</h1>
        <p>This is a test page to demonstrate the floating widget. Look at the bottom-right corner!</p>
        <p>The widget should appear as a floating circle button that expands to show your projects and links.</p>
        <p>Try clicking it to see the expandable panel with all your projects!</p>
    </div>

    <!-- This is the magic line that adds your widget -->
    <script src="/widget/embed.js"></script>
